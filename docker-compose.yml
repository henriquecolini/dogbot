services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dogbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-dogbot}
    volumes:
      - dogbot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${SOURCE_COMMIT:-dev}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dogbot}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-dogbot}"
      TELOXIDE_TOKEN: ${TELOXIDE_TOKEN:?}
      RUST_LOG: ${RUST_LOG:-info}

volumes:
  dogbot_data:
